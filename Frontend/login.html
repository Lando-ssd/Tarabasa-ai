<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaraBasa AI | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/global.css" />
</head>
<body>
  <div class="app-shell">
    <div class="page-wrap">
      <header class="nav-bar">
        <a href="/index.html" class="brand" aria-label="TaraBasa AI home">
          <span class="logo-dot">TB</span>
          <span>TaraBasa AI</span>
        </a>
        <a class="btn btn-secondary btn-logout" href="/index.html">Back</a>
      </header>

      <main class="center-stage">
        <section class="glass-card auth-card">
          <h1>Welcome back</h1>
          <p>Continue your reading journey with TaraBasa AI.</p>

          <form id="login-form" class="form-grid">
            <div class="form-field">
              <label for="email">Email</label>
              <input class="input-control" id="email" type="email" required />
            </div>

            <div class="form-field">
              <label for="password">Password</label>
              <input class="input-control" id="password" type="password" required />
            </div>

            <button class="btn btn-primary" type="submit">Login</button>
          </form>

          <p id="status" class="status-text"></p>
          <p class="helper-link">Need an account? <a href="/register.html">Create one here</a></p>
        </section>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
