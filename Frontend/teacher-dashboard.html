<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaraBasa AI | Teacher Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/global.css" />
</head>
<body>
  <div class="app-shell">
    <div class="page-wrap">
      <header class="nav-bar">
        <a href="/index.html" class="brand" aria-label="TaraBasa AI home">
          <span class="logo-dot">TB</span>
          <span>TaraBasa AI</span>
        </a>
        <a class="btn btn-secondary btn-logout" href="/login.html">Logout</a>
      </header>

      <main class="dashboard">
        <section class="stack">
          <article class="glass-card">
            <h1 class="hero-title">Teacher Dashboard</h1>
            <p class="hero-subtext">
              Welcome! Guide every learner with confidence and keep reading progress on track.
            </p>
          </article>

          <article class="glass-card">
            <h2>Teaching Actions</h2>
            <div class="quick-actions">
              <button class="btn btn-primary" type="button">Add New Student</button>
              <button class="btn btn-secondary" type="button">Review Class Progress</button>
              <button class="btn btn-secondary" type="button">Message Parents</button>
            </div>
          </article>
        </section>

        <aside class="stack">
          <article class="glass-card">
            <h2>Class Snapshot</h2>
            <div class="stat-grid">
              <div class="stat-box">
                <span class="stat-label">Active Students</span>
                <span class="stat-value">24</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Sessions Today</span>
                <span class="stat-value">8</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Reading Goals Met</span>
                <span class="stat-value">17</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Need Support</span>
                <span class="stat-value">3</span>
              </div>
            </div>
          </article>
        </aside>
      </main>
    </div>
  </div>
</body>
</html>
