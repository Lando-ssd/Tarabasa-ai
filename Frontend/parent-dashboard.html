<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaraBasa AI | Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/global.css" />
</head>
<body>
  <div class="app-shell">
    <div class="page-wrap">
      <header class="nav-bar">
        <a href="/index.html" class="brand" aria-label="TaraBasa AI home">
          <span class="logo-dot">TB</span>
          <span>TaraBasa AI</span>
        </a>
        <a class="btn btn-secondary btn-logout" href="/login.html">Logout</a>
      </header>

      <main class="dashboard">
        <section class="stack">
          <article class="glass-card">
            <h1 class="hero-title">Parent Dashboard</h1>
            <p class="hero-subtext">
              Stay connected to your child's reading progress and celebrate each milestone together.
            </p>
          </article>

          <article class="glass-card">
            <h2>Parent Actions</h2>
            <div class="quick-actions">
              <button class="btn btn-primary" type="button">View Progress Report</button>
              <button class="btn btn-secondary" type="button">See Homework Plan</button>
              <button class="btn btn-secondary" type="button">Message Teacher</button>
            </div>
          </article>
        </section>

        <aside class="stack">
          <article class="glass-card">
            <h2>Weekly Snapshot</h2>
            <div class="stat-grid">
              <div class="stat-box">
                <span class="stat-label">Reading Minutes</span>
                <span class="stat-value">125</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Words Mastered</span>
                <span class="stat-value">38</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Lessons Completed</span>
                <span class="stat-value">6</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Teacher Notes</span>
                <span class="stat-value">2</span>
              </div>
            </div>
          </article>
        </aside>
      </main>
    </div>
  </div>
</body>
</html>
