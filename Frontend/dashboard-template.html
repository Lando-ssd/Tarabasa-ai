<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaraBasa AI | Dashboard Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/global.css" />
</head>
<body>
  <div class="app-shell">
    <div class="page-wrap">
      <header class="nav-bar">
        <a href="/index.html" class="brand" aria-label="TaraBasa AI home">
          <span class="logo-dot">TB</span>
          <span>TaraBasa AI</span>
        </a>
        <button class="btn btn-secondary btn-logout" type="button">Logout</button>
      </header>

      <main class="dashboard">
        <section class="stack">
          <article class="glass-card">
            <h1 class="hero-title">Welcome back, Teacher!</h1>
            <p class="hero-subtext">
              Your students are ready to learn. Pick an action to continue their reading journey.
            </p>
          </article>

          <article class="glass-card">
            <h2>Quick Actions</h2>
            <div class="quick-actions">
              <button class="btn btn-primary" type="button">Start Reading Session</button>
              <button class="btn btn-secondary" type="button">Review Progress</button>
              <button class="btn btn-secondary" type="button">Send Parent Update</button>
            </div>
          </article>
        </section>

        <aside class="stack">
          <article class="glass-card">
            <h2>Today at a Glance</h2>
            <div class="stat-grid">
              <div class="stat-box">
                <span class="stat-label">Active Students</span>
                <span class="stat-value">24</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Lessons Completed</span>
                <span class="stat-value">12</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Parent Messages</span>
                <span class="stat-value">5</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Needs Attention</span>
                <span class="stat-value">3</span>
              </div>
            </div>
          </article>
        </aside>
      </main>
    </div>
  </div>
</body>
</html>
